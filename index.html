<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fallout: Old Guard — Загрузка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto+Condensed:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ═══════════════════════════════════════════════════════════════
     Fallout: Old Guard — загрузочный экран.
     Палитра синхронизирована с DOCS/design/tab_menu_mockup.html
     (та же система, что и внутриигровой UI: земля/ржавчина/латунь).
     ═══════════════════════════════════════════════════════════════ */
  :root{
    --ground:#12100E; --panel:#1A1714; --panel-2:#211D19;
    --line:#302923;   --line-soft:#241F1A;

    --text:#D9CEBF;   --muted:#8B8072;  --dim:#5F564C;

    --rust:#C2703A;   --rust-bright:#E08A45;
    --brass:#C9A227;  --olive:#8FA33E;  --blood:#B4503C;

    /* красный из постера Nuka-Cola — он же «метро-акцент» */
    --crimson:#B0161C; --crimson-deep:#7A0F14;

    --display:"Oswald","Segoe UI Semibold",Impact,sans-serif;
    --sans:"Roboto Condensed","Segoe UI",system-ui,"Noto Sans",sans-serif;
    --mono:"Consolas","Cascadia Mono",ui-monospace,"DejaVu Sans Mono",monospace;
  }

  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:var(--ground);color:var(--text);
    font-family:var(--sans);user-select:none;-webkit-font-smoothing:antialiased}

  /* ВАЖНО: везде явные top/right/bottom/left вместо inset — старый CEF
     загрузочного экрана GMod не понимает inset и схлопывает слои в угол. */

  /* ── Фон ─────────────────────────────────────────────────────────
     Постер сдвинут вправо (--poster-left), чтобы рука с бутылкой и
     девушка не залезали на подсказки — по ТЗ подсказки левее них.
     Освободившаяся полоса слева заливается тем же красным, что и левый
     край постера, поэтому стыка не видно: экран читается как одна картинка.
     Крутить композицию — здесь: --poster-left и #bg background-position. */
  #bgfill{position:fixed;top:0;right:0;bottom:0;left:0;z-index:0;
    background:linear-gradient(90deg, #1B0507 0%, #4A0A0E 45%, #6E0C11 100%)}
  #bg{position:fixed;top:0;right:0;bottom:0;left:22%;z-index:0;
    background-color:#7A0F14;
    background-image:radial-gradient(ellipse at 60% 42%, #C11B21 0%, #8E1116 48%, #5E0A0E 100%);
    background-size:cover;background-position:center center;background-repeat:no-repeat;
    animation:drift 40s ease-in-out infinite alternate}
  /* Картинка встаёт вторым слоем — если файла нет, под ней остаётся
     спроектированный красный фон и экран не «ломается». */
  #bg.has-img{background-image:url('img/bg.jpg')}
  @keyframes drift{from{transform:scale(1.02)}to{transform:scale(1.06)}}
  /* растушёвка стыка постера с заливкой */
  #seam{position:fixed;top:0;bottom:0;left:0;width:42%;z-index:1;pointer-events:none;
    background:linear-gradient(90deg, rgba(60,9,13,1) 0%, rgba(70,10,14,.75) 45%, rgba(80,11,16,0) 100%)}

  /* ── Читаемость: слева тёмная шторка под подсказки ── */
  #scrim{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;
    background:linear-gradient(90deg, rgba(9,8,7,.93) 0%, rgba(9,8,7,.84) 22%, rgba(9,8,7,.5) 36%, rgba(9,8,7,0) 52%)}
  #scrim2{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1;pointer-events:none;
    background:linear-gradient(0deg, rgba(9,8,7,.92) 0%, rgba(9,8,7,.25) 22%, rgba(9,8,7,0) 45%,
                                     rgba(9,8,7,.25) 84%, rgba(9,8,7,.78) 100%)}
  /* зерно/скан-линии — «плёнка» довоенного плаката */
  #grain{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;pointer-events:none;opacity:.05;
    background-image:repeating-linear-gradient(0deg,#000 0,#000 1px,transparent 1px,transparent 3px)}
  #vig{position:fixed;top:0;right:0;bottom:0;left:0;z-index:2;pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(9,8,7,0) 45%, rgba(9,8,7,.55) 100%)}

  /* ── Каркас ── */
  .wrap{position:fixed;top:0;right:0;bottom:0;left:0;z-index:3;
    display:flex;flex-direction:column;justify-content:space-between;
    padding:44px 60px 40px}

  /* ── Верх ── */
  .top{display:flex;align-items:flex-start;justify-content:space-between}

  .mode-badge{display:flex;align-items:center;
    border:1px solid var(--line);background:rgba(18,16,14,.72);
    padding:9px 16px 9px 13px}
  .mode-badge i{display:block;width:8px;height:8px;background:var(--olive);
    box-shadow:0 0 10px rgba(143,163,62,.9);margin-right:11px;
    animation:pulse 1.6s ease-in-out infinite}
  .mode-badge span{font-family:var(--mono);font-size:11px;letter-spacing:.20em;
    text-transform:uppercase;color:var(--muted);white-space:nowrap}
  .mode-badge b{color:var(--text);font-weight:400}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  /* Логотип + название — правый верх (по ТЗ) */
  .brand{display:flex;align-items:center;text-align:right}
  .brand .names{margin-right:20px}
  .brand .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.30em;
    text-transform:uppercase;color:var(--rust);margin-bottom:7px}
  .brand h1{font-family:var(--display);font-weight:600;font-size:44px;line-height:.98;
    letter-spacing:.02em;text-transform:uppercase;
    text-shadow:0 3px 22px rgba(0,0,0,.85)}
  .brand h1 em{font-style:normal;color:var(--text)}
  .brand h1 b{font-weight:600;color:var(--brass)}
  .brand .rule{height:2px;background:linear-gradient(90deg,transparent,var(--rust));margin-top:11px}
  .brand svg{display:block;width:86px;height:86px;flex-shrink:0;
    filter:drop-shadow(0 4px 16px rgba(0,0,0,.75))}

  /* ── Центр-слева: подсказки (по ТЗ — левее бутылки и руки) ── */
  .tips{align-self:center;margin-right:auto;max-width:545px;padding-left:6px}
  .tips .label{display:flex;align-items:center;margin-bottom:16px}
  .tips .label span{font-family:var(--mono);font-size:11px;letter-spacing:.32em;
    text-transform:uppercase;color:var(--brass)}
  .tips .label:after{content:"";flex:1;height:1px;background:var(--line);margin-left:14px}

  #tip{font-size:23px;line-height:1.52;color:var(--text);min-height:112px;
    padding-left:20px;border-left:3px solid var(--rust);
    transition:opacity .45s ease, transform .45s ease;
    text-shadow:0 2px 14px rgba(0,0,0,.85)}
  #tip.out{opacity:0;transform:translateX(-10px)}

  .pips{display:flex;margin-top:22px;padding-left:23px}
  .pips i{display:block;width:22px;height:3px;background:var(--line);margin-right:7px;
    transition:background .3s}
  .pips i.on{background:var(--rust-bright)}

  /* ── Низ: прогресс + сервер + ссылки ── */
  .bottom{display:flex;flex-direction:column}

  .status{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
  .status .phase{font-family:var(--mono);font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--text);transition:opacity .2s}
  .status .pct{font-family:var(--display);font-size:26px;font-weight:600;color:var(--brass);
    line-height:1}

  .bar{position:relative;height:6px;width:100%;background:rgba(0,0,0,.55);
    border:1px solid var(--line);overflow:hidden}
  .bar .fill{position:absolute;top:0;bottom:0;left:0;width:0%;
    background:linear-gradient(90deg,var(--crimson),var(--rust),var(--rust-bright));
    box-shadow:0 0 16px rgba(224,138,69,.55)}
  .bar .fill:after{content:"";position:absolute;top:0;right:0;bottom:0;width:2px;
    background:#F6E4C8;box-shadow:0 0 12px #F6E4C8}
  /* «бегунок» поверх заливки, пока идёт работа */
  .bar .sheen{position:absolute;top:0;bottom:0;left:-30%;width:30%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.13),transparent);
    animation:sheen 2.2s linear infinite}
  @keyframes sheen{from{left:-30%}to{left:100%}}

  #file{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:10px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:16px}

  .footer{display:flex;align-items:flex-end;justify-content:space-between;margin-top:26px}

  .links{display:flex}
  .links a{display:flex;align-items:center;padding:11px 20px;margin-right:10px;
    background:rgba(26,23,20,.82);border:1px solid var(--line);
    color:var(--text);text-decoration:none;
    font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    transition:border-color .18s, color .18s, background .18s}
  .links a:hover{border-color:var(--rust);color:var(--rust-bright);background:var(--panel-2)}

  .srv{display:flex;align-items:flex-end}
  .srv .col{text-align:right;margin-left:34px}
  .srv .k{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--dim);margin-bottom:5px}
  .srv .v{font-family:var(--display);font-size:17px;font-weight:500;color:var(--text);line-height:1}
  .srv .v.accent{color:var(--brass)}

  #mute{cursor:pointer;width:40px;height:40px;margin-left:10px;
    background:rgba(26,23,20,.82);border:1px solid var(--line);color:var(--rust);
    display:flex;align-items:center;justify-content:center;font-size:15px;
    transition:border-color .18s,color .18s}
  #mute:hover{border-color:var(--rust);color:var(--rust-bright)}

  /* ── Компактнее на низких разрешениях (720p и ноутбуки) ── */
  @media (max-height:800px){
    .wrap{padding:30px 44px 28px}
    .brand h1{font-size:34px}
    .brand svg{width:68px;height:68px}
    #tip{font-size:19px;min-height:92px}
    .tips{max-width:520px}
  }
  @media (max-width:1100px){
    #scrim{background:linear-gradient(90deg, rgba(9,8,7,.95) 0%, rgba(9,8,7,.88) 45%, rgba(9,8,7,.5) 100%)}
    .tips{max-width:460px}
  }
</style>
</head>
<body>
  <div id="bgfill"></div>
  <div id="bg"></div>
  <div id="seam"></div>
  <div id="scrim"></div>
  <div id="scrim2"></div>
  <div id="grain"></div>
  <div id="vig"></div>

  <div class="wrap">

    <!-- ── ВЕРХ ── -->
    <div class="top">
      <div class="mode-badge">
        <i></i><span>Hard (Serious) Roleplay · <b>Пустошь</b></span>
      </div>

      <!-- Логотип + название (правый верх — по ТЗ) -->
      <div class="brand">
        <div class="names">
          <div class="kicker">Wasteland Protocol</div>
          <h1><em>Fallout</em><br><b>Old Guard</b></h1>
          <div class="rule"></div>
        </div>
        <!-- Логотип: пробка Nuka-Cola (21 зубец, как настоящая) + звезда + монограмма -->
        <svg viewBox="0 0 100 100" role="img" aria-label="Fallout: Old Guard">
          <circle cx="50" cy="50" r="47" fill="#0E0C0B"/>
          <circle cx="50" cy="50" r="44" fill="#7A0F14"/>
          <!-- зубцы пробки: штриховая обводка = ровно 21 «крышечный» зуб -->
          <circle cx="50" cy="50" r="40" fill="none" stroke="#D9CEBF" stroke-width="9"
                  stroke-dasharray="6.7 5.27"/>
          <circle cx="50" cy="50" r="36" fill="#12100E"/>
          <circle cx="50" cy="50" r="33.5" fill="none" stroke="#C2703A" stroke-width="1.4"/>
          <!-- звезда «старой гвардии» -->
          <path fill="#C9A227" d="M50,25 L52.70,32.28 L60.46,32.60 L54.37,37.42 L56.47,44.90
                                  L50,40.60 L43.53,44.90 L45.63,37.42 L39.54,32.60 L47.30,32.28 Z"/>
          <path stroke="#C2703A" stroke-width="1.2" d="M31,50 H69"/>
          <text x="50" y="66.5" text-anchor="middle" fill="#D9CEBF"
                font-family="Oswald, 'Segoe UI Semibold', Impact, sans-serif"
                font-size="19" font-weight="600" letter-spacing="1.5">OG</text>
          <text x="50" y="79" text-anchor="middle" fill="#8B8072"
                font-family="Consolas, monospace" font-size="7" letter-spacing="1.2">EST. 2287</text>
        </svg>
      </div>
    </div>

    <!-- ── ЦЕНТР-СЛЕВА: подсказки (по ТЗ) ── -->
    <div class="tips">
      <div class="label"><span>Памятка выжившего</span></div>
      <div id="tip"></div>
      <div class="pips" id="pips"></div>
    </div>

    <!-- ── НИЗ: прогресс, сервер, ссылки ── -->
    <div class="bottom">
      <div class="status">
        <div class="phase" id="phase">Установка соединения…</div>
        <div class="pct" id="pct">0%</div>
      </div>
      <div class="bar">
        <div class="fill" id="fill"></div>
        <div class="sheen"></div>
      </div>
      <div id="file">Ожидание ответа сервера…</div>

      <div class="footer">
        <div class="links">
          <a href="https://discord.gg/" target="_blank">Discord</a>
          <a href="https://vk.com/" target="_blank">VK</a>
          <div id="mute" title="Звук">♪</div>
        </div>
        <div class="srv">
          <div class="col"><div class="k">Сервер</div><div class="v" id="srv-name">Fallout: Old Guard</div></div>
          <div class="col"><div class="k">Карта</div><div class="v" id="srv-map">—</div></div>
          <div class="col"><div class="k">Режим</div><div class="v" id="srv-gm">fallout</div></div>
          <div class="col"><div class="k">Слоты</div><div class="v accent" id="srv-max">— / 100</div></div>
        </div>
      </div>
    </div>
  </div>

  <audio id="bgm" loop></audio>

<script>
/* ═══════════════════════════════════════════════════════════════════
   НАСТРОЙКА — всё, что обычно правят, лежит здесь.
   ═══════════════════════════════════════════════════════════════════ */
var CONFIG = {
  // Фон-постер. Положи картинку в img/bg.jpg (JPG, ~1920px, < 500 КБ).
  background: 'img/bg.jpg',

  // Фоновая музыка (не обязательно). Файлы в audio/, играют по кругу.
  tracks: [],            // напр. ['audio/ambient1.mp3','audio/ambient2.mp3']
  volume: 0.20,

  // Данные сервера до того, как GMod пришлёт настоящие (GameDetails).
  server: { name:'Fallout: Old Guard', gamemode:'fallout', map:'—', maxplayers:100 },

  tipInterval: 7000      // мс между подсказками
};

/* Подсказки — тексты из ТЗ, порядок сохранён. */
var TIPS = [
  'Если вы умрёте от чего-либо и у вас нет Счастливой Крышки, ваш персонаж умрёт навсегда.',
  'Если раненного вас добьёт другой игрок, вас не спасёт даже Счастливая Крышка. Персонаж умрёт навсегда.',
  'Сервер придерживается принципов Hard (Serious) Roleplay. Отклонение от режима влечёт наказание.',
  'Вы можете написать квенту в нашем Discord или VK и получить бонусы со старта!',
  'Чем дальше в Пустошь — тем больше радиация! Исследуйте осторожно!',
  'Администрация сервера поощряет за качественную ролевую игру.',
  'Гайды и инструкции по игре есть в Discord и VK проекта.'
];

/* Подписи фаз подключения. */
var PHASES = {
  connect:  'Установка соединения…',
  map:      'Загрузка карты Пустоши…',
  workshop: 'Проверка подписок Workshop…',
  download: 'Загрузка контента…',
  client:   'Инициализация клиента…',
  spawn:    'Выход на поверхность…'
};

/* ═══════════════════════════════════════════════════════════════════ */
function $(id){ return document.getElementById(id); }

/* ── Фон: подключаем картинку только если она реально загрузилась ── */
(function(){
  var probe = new Image();
  probe.onload  = function(){ $('bg').className = 'has-img'; };
  probe.onerror = function(){ /* остаётся спроектированный красный фон */ };
  probe.src = CONFIG.background;
})();

/* ── Ротация подсказок ── */
(function(){
  var el = $('tip'), pipsBox = $('pips'), i = 0, pips = [];
  for (var n = 0; n < TIPS.length; n++){
    var p = document.createElement('i');
    pipsBox.appendChild(p); pips.push(p);
  }
  function paint(){
    el.textContent = TIPS[i];
    for (var n = 0; n < pips.length; n++) pips[n].className = (n === i ? 'on' : '');
  }
  function next(){
    el.className = 'out';
    setTimeout(function(){
      i = (i + 1) % TIPS.length;
      paint();
      el.className = '';
    }, 450);
  }
  paint();
  setInterval(next, CONFIG.tipInterval);
})();

/* ── Прогресс подключения ────────────────────────────────────────────
   GMod вызывает на этой странице глобальные функции: GameDetails,
   SetFilesTotal, SetFilesNeeded, DownloadingFile, AllDownloadsComplete.
   Вне игры (в браузере) крутится демо, чтобы экран можно было смотреть. */
var inGmod = false, phase = '', target = 0, shown = 0, done = false;
var filesTotal = 0;

function clamp(v,a,b){ return v < a ? a : (v > b ? b : v); }

function setPhase(p){
  if (p === phase) return;
  phase = p;
  var el = $('phase');
  el.style.opacity = 0;
  setTimeout(function(){ el.textContent = PHASES[p] || p; el.style.opacity = 1; }, 180);
}
function setProgress(pct){ target = clamp(pct, 0, 100); }
function setFile(name){ $('file').textContent = name; }

(function tick(){
  shown += (target - shown) * 0.08;
  if (target - shown < 0.4) shown = target;
  $('fill').style.width = shown + '%';
  $('pct').textContent = Math.round(shown) + '%';
  if (Math.round(shown) >= 100 && !done){
    done = true;
    setPhase('spawn');
    setFile('Готово. Синхронизация с сервером…');
  }
  requestAnimationFrame(tick);
})();

/* ── Данные сервера ── */
function applyServerInfo(name, map, max, gm){
  if (name) $('srv-name').textContent = name;
  if (map)  $('srv-map').textContent  = map;
  if (gm)   $('srv-gm').textContent   = String(gm).replace(/_/g, ' ');
  var m = parseInt(max, 10);
  if (isFinite(m) && m > 0){
    CONFIG.server.maxplayers = m;
    $('srv-max').textContent = '— / ' + m;
  }
}
applyServerInfo(CONFIG.server.name, CONFIG.server.map, CONFIG.server.maxplayers, CONFIG.server.gamemode);

/* ── Колбэки GMod ── */
window.GameDetails = function(servername, serverurl, mapname, maxplayers, steamid, gamemode){
  inGmod = true; stopDemo();
  applyServerInfo(servername, mapname, maxplayers, gamemode);
  setPhase('map'); setProgress(12);
};
window.SetFilesTotal = function(total){
  inGmod = true; stopDemo();
  filesTotal = total; setPhase('download');
};
window.SetFilesNeeded = function(needed){
  inGmod = true;
  if (filesTotal > 0) setProgress(12 + (1 - needed / filesTotal) * 82);
};
window.DownloadingFile = function(fileName){
  inGmod = true; setPhase('download');
  setFile(String(fileName).replace(/^\s+|"+/g, ''));
};
window.AllDownloadsComplete = function(){
  setProgress(97); setPhase('client'); setFile('Контент загружен.');
};
window.SetStatusChanged = function(status){ if (status) setFile(status); };
window.SetSecure = function(){};

/* Фолбэк: некоторые конфиги отдают данные через URL (и это удобно
   для проверки страницы в обычном браузере). */
(function(){
  var q = new URLSearchParams(location.search);
  applyServerInfo(q.get('servername') || q.get('hostname'),
                  q.get('mapname') || q.get('map'),
                  q.get('maxplayers'),
                  q.get('gamemode') || q.get('gm'));
})();

/* ── Демо-режим (вне GMod) ── */
var demoTimer = null, demoActive = false;
function stopDemo(){ demoActive = false; if (demoTimer) clearTimeout(demoTimer); }

var demoFiles = [
  'maps/rp_fallout_wasteland.bsp',
  'models/fallout/playermodels/ghoul_01.mdl',
  'materials/models/fallout/pa_t45d_diffuse.vtf',
  'models/weapons/tfa_fo4/w_10mm.mdl',
  'sound/fallout/radio/galaxy_news_01.mp3',
  'materials/fallout/hud/pipboy_overlay.vmt',
  'models/props_fallout/nukacola_machine.mdl',
  'models/props_fallout/dufflebag.mdl',
  'sound/fallout/ambient/geiger_tick.wav',
  'materials/models/fallout/robobrain_body.vtf',
  'models/props_fallout/steamertrunk01.mdl',
  'materials/fallout/loading/logo.png'
];

function runDemo(){
  if (inGmod) return;
  demoActive = true;
  var total = 700 + Math.floor(Math.random() * 300);
  var seq = [
    { p:'connect',  pct:6,  dur:1400, f:'Установка соединения с сервером…' },
    { p:'map',      pct:20, dur:2600, f:'maps/rp_fallout_wasteland.bsp' },
    { p:'workshop', pct:32, dur:2000, f:'Проверка подписок Steam Workshop…' }
  ];
  var step = 0;

  function phaseStep(){
    if (!demoActive) return;
    if (step < seq.length){
      var s = seq[step++];
      setPhase(s.p); setProgress(s.pct); setFile(s.f);
      demoTimer = setTimeout(phaseStep, s.dur);
    } else {
      downloadPhase(0);
    }
  }
  function downloadPhase(doneN){
    if (!demoActive) return;
    setPhase('download');
    doneN = Math.min(total, doneN + 6 + Math.floor(Math.random() * 22));
    setProgress(32 + (doneN / total) * 60);
    setFile(demoFiles[Math.floor(Math.random() * demoFiles.length)]);
    if (doneN < total){
      demoTimer = setTimeout(function(){ downloadPhase(doneN); }, 240 + Math.random() * 260);
    } else {
      setPhase('client'); setProgress(97); setFile('Контент загружен.');
      demoTimer = setTimeout(function(){ setProgress(100); }, 1800);
    }
  }
  phaseStep();
}
/* Если через 1.2 с GMod не отозвался — значит, это браузер. */
setTimeout(function(){ if (!inGmod) runDemo(); }, 1200);

/* ── Музыка ── */
(function(){
  var bgm = $('bgm'), mute = $('mute');
  if (!CONFIG.tracks.length){ mute.style.display = 'none'; return; }
  var idx = Math.floor(Math.random() * CONFIG.tracks.length);
  bgm.volume = CONFIG.volume;
  bgm.src = CONFIG.tracks[idx];
  bgm.loop = CONFIG.tracks.length === 1;
  bgm.addEventListener('ended', function(){
    idx = (idx + 1) % CONFIG.tracks.length;
    bgm.src = CONFIG.tracks[idx];
    bgm.play();
  });
  function tryPlay(){ var p = bgm.play(); if (p && p.catch) p.catch(function(){}); }
  tryPlay();
  // CEF может заблокировать автоплей — стартуем по первому событию
  ['click','keydown','mousemove'].forEach(function(e){
    window.addEventListener(e, tryPlay, { once:true });
  });
  mute.addEventListener('click', function(){
    bgm.muted = !bgm.muted;
    mute.textContent = bgm.muted ? '╳' : '♪';
  });
})();
</script>
